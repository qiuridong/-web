# 脚本货架 · host nginx vhost（路径 B：与签到管家同一台 VPS 共存）
# 放到 /etc/nginx/sites-available/hub.aijiaxia.cc，软链到 sites-enabled，
# nginx -t && systemctl reload nginx，然后 certbot --nginx -d hub.aijiaxia.cc 自动补 443+证书。
#
# 前置：DNS A 记录 hub.aijiaxia.cc → 154.9.238.144（已添加）；
#       货架后端容器跑在 127.0.0.1:8100（docker-compose.yml）；
#       货架前端 dist 已 scp 到 /opt/signin-hub/frontend_dist。
#
# 与主站 jb.aijiaxia.cc 完全独立（不同 server_name），互不影响。

server {
    listen 80;
    listen [::]:80;
    server_name hub.aijiaxia.cc;

    root /opt/signin-hub/frontend_dist;
    index index.html;

    access_log /var/log/nginx/hub.access.log;
    error_log  /var/log/nginx/hub.error.log;

    # API → 货架后端容器
    location /api/ {
        proxy_pass http://127.0.0.1:8100;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 8m;          # 上传 zip 上限留余量
    }

    location = /health {
        proxy_pass http://127.0.0.1:8100/health;
    }

    # 前端静态资源长缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback
    location / {
        try_files $uri /index.html;
    }
}
