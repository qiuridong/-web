# 脚本货架 · 备份兜底站 hub2 host nginx vhost(38.49.208.71 / hub2.aijiaxia.cc)
# 与 nginx-hub.conf(154 主站)同构,仅 server_name + root 不同。
#
# 放到 /etc/nginx/sites-available/hub2.aijiaxia.cc,软链到 sites-enabled,
# nginx -t && systemctl reload nginx,再 certbot --nginx -d hub2.aijiaxia.cc 自动补 443+证书。
#
# 前置：DNS A 记录 hub2.aijiaxia.cc → 38.49.208.71(灰云直连);
#       货架后端容器跑在 127.0.0.1:8100(docker-compose.yml,COMPOSE_PROJECT_NAME=signin-hub2);
#       前端 dist 经 ASCII 软链暴露：ln -sfn /opt/sign-hub-src/脚本货架/frontend_dist /opt/signin-hub2-dist
#       (nginx root 用 ASCII 软链,避免中文路径)。
#
# 与该机已有 jellyfin 等 vhost 完全独立(不同 server_name),互不影响。

server {
    listen 80;
    listen [::]:80;
    server_name hub2.aijiaxia.cc;

    root /opt/signin-hub2-dist;
    index index.html;

    access_log /var/log/nginx/hub2.access.log;
    error_log  /var/log/nginx/hub2.error.log;

    # API → 货架后端容器
    location /api/ {
        proxy_pass http://127.0.0.1:8100;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 8m;
    }

    location = /health {
        proxy_pass http://127.0.0.1:8100/health;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri /index.html;
    }
}
