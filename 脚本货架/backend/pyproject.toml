[project]
name = "script-hub-backend"
version = "0.1.0"
description = "脚本货架 — 后端 (FastAPI + SQLite)，签到管家的附属脚本仓库"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
authors = [{ name = "yunkelai", email = "yunkelai12251@gmail.com" }]

dependencies = [
    # ===== Web 框架 =====
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "python-multipart>=0.0.9,<1.0",      # 文件上传(zip)

    # ===== 数据 =====
    "sqlalchemy>=2.0.30,<3.0",
    "alembic>=1.13,<2.0",
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.3,<3.0",

    # ===== 安全 =====
    "bcrypt>=4.1,<5.0",

    # ===== YAML(manifest 解析)=====
    "pyyaml>=6.0,<7.0",

    # ===== 日志 =====
    "loguru>=0.7,<1.0",

    # ===== HTTP(M3 从 URL 导入预留)=====
    "httpx>=0.27,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "ruff>=0.5,<1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "C4", "UP", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
