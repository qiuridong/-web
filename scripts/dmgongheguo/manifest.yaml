slug: dmgongheguo
name: 动漫共和国每日签到
description: |
  在官方 Android Emulator 上检查/恢复动漫共和国 App 登录态，并幂等执行每日签到。

  验证码采用本地 ddddocr + 目标字形模板的保守集成：只提交完整 token 链、
  多阈值一致且运算符被双通道确认的乘法题；加减除、两位数边界不清或任何
  低置信图片都会自动刷新，提交前再核对验证码像素指纹没有变化。

  任务中心先用视觉模板定位，再通过 Android accessibility 语义树核实顶部
  “签到”按钮或“金币”余额；历史奖励勾选不再作为今天已签到的成功依据。

  Android Emulator 由 systemd 按需启动，所有实例共享全局串行锁；任务成功、
  失败或收到 SIGTERM 都会优雅关机。每个账户绑定独立 AVD，并以昵称字形签名
  复核登录身份。替换单账户时只需在管家修改账号密码，Agent 会受控清理旧会话、
  自动登录新账号并重建绑定；v1.2.8 修复历史首日勾选导致的跨日假成功，
  并用底栏语义状态从“频道”等错位页恢复 unknown 页面；同时保留换绑旧画面
  防抖、ADB 冷启动重试、公告恢复和验证码临界刷新逻辑；
  同时保留多个账户时仍需每账户独立 AVD。
version: 1.2.8
author: yunkelai

default_cron: "20 8 * * *"
default_timeout_sec: 1200
icon: icon.svg

fields:
  - key: account
    label: 邮箱账号
    type: string
    required: true
    description: 用于登录恢复及 AVD 账户绑定；实例配置整体由面板 Fernet 加密存储。
    placeholder: "you@example.com"

  - key: password
    label: 登录密码
    type: secret
    required: true
    description: 登录态失效时使用；当前安全输入器支持字母、数字以及 @ . -。

  - key: auto_rebind_account
    label: 账号变化时自动换绑
    type: boolean
    default: true
    description: 单账户替换时保持开启；检测到邮箱变化后由 Agent 清除旧 App 会话，自动登录并绑定新账号。关闭时账号不匹配会安全停止。

  - key: emulator_avd
    label: 专属 Emulator AVD
    type: string
    required: true
    default: "poc34"
    pattern: "^[A-Za-z0-9._-]{1,64}$"
    description: 一个账户绑定一个独立 AVD；多个账户可以串行复用端口 6554，但不能共用 AVD。

  - key: manage_emulator
    label: 按需管理 Emulator
    type: boolean
    default: true
    description: 任务前通过 systemd 启动指定 AVD；生产环境应保持开启。

  - key: stop_emulator_after_run
    label: 任务后关闭 Emulator
    type: boolean
    default: true
    description: 成功、失败或中断后都关闭 Emulator，释放约 2.8 GiB 内存。

  - key: emulator_start_timeout_sec
    label: Emulator 启动超时（秒）
    type: integer
    default: 300
    min: 60
    max: 600

  - key: emulator_shutdown_timeout_sec
    label: Emulator 关闭超时（秒）
    type: integer
    default: 60
    min: 10
    max: 120

  - key: emulator_lock_timeout_sec
    label: 串行锁等待上限（秒）
    type: integer
    default: 600
    min: 0
    max: 900
    description: 多个 Android 实例碰撞时排队等待；仍建议把计划时间错开 10–15 分钟。

  - key: app_ready_timeout_sec
    label: App 冷启动等待上限（秒）
    type: integer
    default: 240
    min: 120
    max: 480
    description: arm64 App 在 x86 转译环境冷启动较慢；只延长等待，不会盲点未知界面。

  - key: adb_path
    label: ADB 路径
    type: string
    required: true
    default: "/opt/android-sdk/platform-tools/adb"

  - key: adb_serial
    label: ADB 设备序列号
    type: string
    required: true
    default: "emulator-6554"
    description: 安全合同锁定 emulator-6554，填写其它值会 fail-closed。

  - key: captcha_max_images
    label: 单次最多查看验证码数
    type: integer
    default: 30
    min: 4
    max: 30
    description: 低置信图片只刷新不提交；默认 30 张提高首次换号登录成功率，弹窗超时后会重新打开继续计数。

  - key: captcha_max_submissions
    label: 最多验证码提交次数
    type: integer
    default: 2
    min: 1
    max: 3
    description: 限制真正提交次数；刷新不计入此值。

  - key: captcha_refresh_interval_sec
    label: 验证码刷新间隔（秒）
    type: integer
    default: 12
    min: 5
    max: 30
    description: 服务端有刷新频率限制；建议保持 12 秒，避免“获取问题过于频繁”。

  - key: captcha_min_confidence
    label: 验证码最低置信度
    type: string
    default: "0.72"
    pattern: "^0\\.(5[0-9]|6[0-9]|7[0-9]|8[0-9]|9[0-9])$"
    description: 建议保持 0.72；调高会增加刷新，调低会增加误提交风险。

  - key: auto_install_ocr
    label: 自动安装 OCR 环境
    type: boolean
    default: true
    description: 首次运行用 uv 在实例 data_dir 创建 Python 3.12 独立 venv。

  - key: uv_path
    label: uv 路径（可选）
    type: string
    required: false
    default: "/root/.local/bin/uv"

  - key: ocr_python
    label: 已有 OCR Python（可选）
    type: string
    required: false
    description: 留空自动使用 data_dir/.ocr-venv；填写后必须通过自检。

  - key: random_delay_sec
    label: 随机延迟（秒）
    type: integer
    default: 0
    min: 0
    max: 1800

runtime:
  python_version: ">=3.10"
  isolated: true
